<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Life - Prenotazione Corsi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ff0000;
        }

        .container {
            background: #050000;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            border: 2px solid #ff0000;
        }

        .brand-title {
            color: #ff0000;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0 0 5px 0;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #ff0000;
            font-size: 20px;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #cc0000;
            margin-bottom: 25px;
            font-size: 13px;
            text-align: center;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ff0000;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ff0000;
            background-color: #000000;
            color: #ff0000;
            border-radius: 4px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #880000;
        }

        input:disabled, select:disabled {
            background-color: #1a0000;
            color: #550000;
            border-color: #550000;
            cursor: not-allowed;
        }

        input:focus, select:focus {
            border-color: #ff3333;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }

        .btn-container {
            margin-top: 10px;
        }

        button {
            background-color: #ff0000;
            color: #000000;
            border: 2px solid #ff0000;
            padding: 14px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            background-color: #000000;
            color: #ff0000;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #330000;
            color: #000000;
            border-color: #330000;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #ff0000;
            background-color: #000000;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="brand-title">Steel Life</h2>
        <h1>🏋️ Prenota Corso</h1>
        <p class="subtitle">Seleziona attività, giorno e orario (Max 6 persone per slot)</p>

        <form id="bookingForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Inserisci il nome" required>
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome</label>
                    <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome" required>
                </div>

                <div class="form-group">
                    <label for="attivita">Attività</label>
                    <select id="attivita" name="attivita" required>
                        <option value="">Seleziona attività</option>
                        <option value="MMA">MMA</option>
                        <option value="Boxe">Boxe</option>
                        <option value="Kickboxing">Kickboxing</option>
                        <option value="BJJ">BJJ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="giorno">Giorno</label>
                    <select id="giorno" name="giorno" required>
                        <option value="">Seleziona prima un'attività</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="orario">Orario</label>
                    <select id="orario" name="orario" required>
                        <option value="">Seleziona prima un giorno</option>
                    </select>
                </div>

                <div class="form-group btn-container">
                    <button type="submit" id="submitBtn">PRENOTA</button>
                </div>
            </div>
        </form>

        <div id="formStatus" class="status-message">Benvenuto! Seleziona i campi per procedere.</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const attivitaSelect = document.getElementById('attivita');
            const giornoSelect = document.getElementById('giorno');
            const orarioSelect = document.getElementById('orario');
            const nomeInput = document.getElementById('nome');
            const cognomeInput = document.getElementById('cognome');
            const submitBtn = document.getElementById('submitBtn');
            const bookingForm = document.getElementById('bookingForm');
            const formStatus = document.getElementById('formStatus');

            const orariDisponibili = {
                "MMA": {
                    giorni: ["Lunedì", "Mercoledì", "Venerdì"],
                    orari: ["18:00 - 19:00", "19:00 - 20:00", "20:00 - 21:00"]
                },
                "Boxe": {
                    giorni: ["Martedì", "Giovedì"],
                    orari: ["18:00 - 19:00"]
                },
                "Kickboxing": {
                    giorni: ["Martedì", "Giovedì"],
                    orari: ["19:00 - 20:00"]
                },
                "BJJ": {
                    giorni: ["Martedì", "Giovedì"],
                    orari: ["20:00 - 21:00"]
                }
            };

            // Funzione per calcolare il numero della settimana corrente (es. 2026-W38)
            function getNumeroSettimanaCorrente() {
                const d = new Date();
                d.setHours(0, 0, 0, 0);
                d.setDate(d.getDate() + 4 - (d.getDay() || 7));
                const annoInizio = new Date(d.getFullYear(), 0, 1);
                const numeroSettimana = Math.ceil((((d - annoInizio) / 86400000) + 1) / 7);
                return `${d.getFullYear()}-W${numeroSettimana}`;
            }

            function getChiaveSlot(attivita, giorno, orario) {
                const settimana = getNumeroSettimanaCorrente();
                return `${settimana}_${attivita}_${giorno}_${orario}`;
            }

            function mostraStato(messaggio, coloreTesto, coloreSfondo, coloreBordo) {
                formStatus.textContent = messaggio;
                formStatus.style.color = coloreTesto;
                formStatus.style.backgroundColor = coloreSfondo;
                formStatus.style.borderColor = coloreBordo;
            }

            function aggiornaGiorni() {
                const attivita = attivitaSelect.value;
                giornoSelect.innerHTML = '<option value="">Seleziona giorno</option>';
                orarioSelect.innerHTML = '<option value="">Seleziona orario</option>';
                ripristinaCampi();
                mostraStato("Seleziona giorno e orario per verificare la disponibilità.", "#ff0000", "#000000", "#ff0000");

                if (attivita && orariDisponibili[attivita]) {
                    orariDisponibili[attivita].giorni.forEach(giorno => {
                        const opt = document.createElement('option');
                        opt.value = giorno;
                        opt.textContent = giorno;
                        giornoSelect.appendChild(opt);
                    });
                }
            }

            function aggiornaOrari() {
                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                orarioSelect.innerHTML = '<option value="">Seleziona orario</option>';
                ripristinaCampi();
                mostraStato("Seleziona l'orario per procedere.", "#ff0000", "#000000", "#ff0000");

                if (attivita && giorno && orariDisponibili[attivita]) {
                    orariDisponibili[attivita].orari.forEach(orario => {
                        const opt = document.createElement('option');
                        opt.value = orario;
                        opt.textContent = orario;
                        orarioSelect.appendChild(opt);
                    });
                }
            }

            function getPostiOccupati(chiaveSlot) {
                return parseInt(localStorage.getItem(chiaveSlot) || '0');
            }

            function incrementaPosti(chiaveSlot) {
                const attuali = getPostiOccupati(chiaveSlot);
                localStorage.setItem(chiaveSlot, attuali + 1);
            }

            function ripristinaCampi() {
                nomeInput.disabled = false;
                cognomeInput.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'PRENOTA';
            }

            function controllaSlot() {
                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                const orario = orarioSelect.value;

                if (attivita && giorno && orario) {
                    const chiaveSlot = getChiaveSlot(attivita, giorno, orario);
                    const postiOccupati = getPostiOccupati(chiaveSlot);

                    if (postiOccupati >= 6) {
                        mostraStato('⛔ SUPERAMENTO LIMITE MASSIMO: Questo corso è al completo (6/6 posti esauriti).', '#ff0000', '#220000', '#ff0000');
                        nomeInput.disabled = true;
                        cognomeInput.disabled = true;
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'CORSO ESAURITO';
                    } else {
                        const rimanenti = 6 - postiOccupati;
                        mostraStato(`ℹ️ Posti occupati: ${postiOccupati}/6 (Disponibili: ${rimanenti})`, '#00ff00', '#002200', '#00ff00');
                        ripristinaCampi();
                    }
                }
            }

            attivitaSelect.addEventListener('change', aggiornaGiorni);
            giornoSelect.addEventListener('change', aggiornaOrari);
            orarioSelect.addEventListener('change', controllaSlot);

            bookingForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                const orario = orarioSelect.value;
                const nome = nomeInput.value;
                const cognome = cognomeInput.value;
                
                const chiaveSlot = getChiaveSlot(attivita, giorno, orario);
                const postiOccupati = getPostiOccupati(chiaveSlot);

                if (postiOccupati >= 6) {
                    mostraStato('❌ Spiacenti, questo corso ha esaurito i posti disponibili!', '#ff0000', '#220000', '#ff0000');
                    return;
                }
                
                // Aggiorna il contatore dei posti legato alla settimana corrente
                incrementaPosti(chiaveSlot);

                // Numero di telefono di Ciro
                const numeroCiro = "393281814024";

                // Testo del messaggio precompilato per WhatsApp
                const testoMessaggio = `🏋️ *Nuova Prenotazione - Steel Life*%0A` +
                                       `👤 *Nome:* ${nome} ${cognome}%0A` +
                                       `🥊 *Attività:* ${attivita}%0A` +
                                       `📅 *Giorno:* ${giorno}%0A` +
                                       `⏰ *Orario:* ${orario}`;

                const urlWhatsApp = `https://wa.me/${numeroCiro}?text=${testoMessaggio}`;
                
                mostraStato(`✅ Prenotazione registrata! Apertura WhatsApp...`, '#00ff00', '#002200', '#00ff00');
                
                setTimeout(() => {
                    window.location.href = urlWhatsApp;
                }, 800);
            });
        });
    </script>
</body>
</html>
