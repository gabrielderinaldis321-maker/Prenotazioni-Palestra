<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione Corsi Palestra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            color: #ffffff;
            font-size: 22px;
        }

        .subtitle {
            color: #aaaaaa;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 13px;
            color: #cccccc;
        }

        input, select {
            padding: 12px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #ffffff;
            border-radius: 4px;
            font-size: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        input:disabled, select:disabled {
            background-color: #1a1a1a;
            color: #666;
            cursor: not-allowed;
        }

        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
        }

        .btn-container {
            margin-top: 10px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #333;
            color: #666;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #aaaaaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️ Prenota Corso</h1>
        <p class="subtitle">Seleziona attività, giorno e orario (Max 6 persone per slot)</p>

        <form id="bookingForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Inserisci il nome" required>
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome</label>
                    <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Inserisci la tua email" required>
                </div>

                <div class="form-group">
                    <label for="attivita">Attività</label>
                    <select id="attivita" name="attivita" required>
                        <option value="">Seleziona attività</option>
                        <option value="MMA">MMA</option>
                        <option value="Boxe">Boxe</option>
                        <option value="Kickboxing">Kickboxing</option>
                        <option value="BJJ">BJJ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="giorno">Giorno</label>
                    <select id="giorno" name="giorno" required>
                        <option value="">Seleziona prima un'attività</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="orario">Orario</label>
                    <select id="orario" name="orario" required>
                        <option value="">Seleziona prima un giorno</option>
                    </select>
                </div>

                <div class="form-group btn-container">
                    <button type="submit" id="submitBtn">PRENOTA</button>
                </div>
            </div>
        </form>

        <div id="formStatus" class="status-message">Benvenuto! Seleziona i campi per procedere.</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const attivitaSelect = document.getElementById('attivita');
            const giornoSelect = document.getElementById('giorno');
            const orarioSelect = document.getElementById('orario');
            const nomeInput = document.getElementById('nome');
            const cognomeInput = document.getElementById('cognome');
            const emailInput = document.getElementById('email');
            const submitBtn = document.getElementById('submitBtn');
            const bookingForm = document.getElementById('bookingForm');
            const formStatus = document.getElementById('formStatus');

            const orariDisponibili = {
                "MMA": {
                    giorni: ["Lunedì", "Mercoledì", "Venerdì"],
                    orari: ["18:00 - 19:00", "19:00 - 20:00", "20:00 - 21:00"]
                },
                "Boxe": {
                    giorni: ["Martedì", "Giovedì"],
                    orari: ["18:00 - 19:00"]
                },
                "Kickboxing": {
                    giorni: ["Martedì", "Giovedì"],
                    orari: ["19:00 - 20:00"]
                },
                "BJJ": {
                    giorni: ["Martedì", "Giovedì"],
                    orari: ["20:00 - 21:00"]
                }
            };

            function mostraStato(messaggio, coloreTesto, coloreSfondo, coloreBordo) {
                formStatus.textContent = messaggio;
                formStatus.style.color = coloreTesto;
                formStatus.style.backgroundColor = coloreSfondo;
                formStatus.style.borderColor = coloreBordo;
            }

            function aggiornaGiorni() {
                const attivita = attivitaSelect.value;
                giornoSelect.innerHTML = '<option value="">Seleziona giorno</option>';
                orarioSelect.innerHTML = '<option value="">Seleziona orario</option>';
                ripristinaCampi();
                mostraStato("Seleziona giorno e orario per verificare la disponibilità.", "#aaaaaa", "#2a2a2a", "#444");

                if (attivita && orariDisponibili[attivita]) {
                    orariDisponibili[attivita].giorni.forEach(giorno => {
                        const opt = document.createElement('option');
                        opt.value = giorno;
                        opt.textContent = giorno;
                        giornoSelect.appendChild(opt);
                    });
                }
            }

            function aggiornaOrari() {
                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                orarioSelect.innerHTML = '<option value="">Seleziona orario</option>';
                ripristinaCampi();
                mostraStato("Seleziona l'orario per procedere.", "#aaaaaa", "#2a2a2a", "#444");

                if (attivita && giorno && orariDisponibili[attivita]) {
                    orariDisponibili[attivita].orari.forEach(orario => {
                        const opt = document.createElement('option');
                        opt.value = orario;
                        opt.textContent = orario;
                        orarioSelect.appendChild(opt);
                    });
                }
            }

            function getPostiOccupati(chiaveSlot) {
                return parseInt(localStorage.getItem(chiaveSlot) || '0');
            }

            function incrementaPosti(chiaveSlot) {
                const attuali = getPostiOccupati(chiaveSlot);
                localStorage.setItem(chiaveSlot, attuali + 1);
            }

            function ripristinaCampi() {
                nomeInput.disabled = false;
                cognomeInput.disabled = false;
                emailInput.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'PRENOTA';
            }

            function controllaSlot() {
                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                const orario = orarioSelect.value;

                if (attivita && giorno && orario) {
                    const chiaveSlot = `${attivita}_${giorno}_${orario}`;
                    const postiOccupati = getPostiOccupati(chiaveSlot);

                    if (postiOccupati >= 6) {
                        mostraStato('⛔ SUPERAMENTO LIMITE MASSIMO: Questo corso è al completo (6/6 posti esauriti).', '#ff6b6b', '#2a1212', '#a52a2a');
                        nomeInput.disabled = true;
                        cognomeInput.disabled = true;
                        emailInput.disabled = true;
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'CORSO ESAURITO';
                    } else {
                        const rimanenti = 6 - postiOccupati;
                        mostraStato(`ℹ️ Posti occupati: ${postiOccupati}/6 (Disponibili: ${rimanenti})`, '#51cf66', '#122618', '#2b8a3e');
                        ripristinaCampi();
                    }
                }
            }

            attivitaSelect.addEventListener('change', aggiornaGiorni);
            giornoSelect.addEventListener('change', aggiornaOrari);
            orarioSelect.addEventListener('change', controllaSlot);

            bookingForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                const orario = orarioSelect.value;
                
                const chiaveSlot = `${attivita}_${giorno}_${orario}`;
                const postiOccupati = getPostiOccupati(chiaveSlot);

                if (postiOccupati >= 6) {
                    mostraStato('❌ Spiacenti, questo corso ha esaurito i posti disponibili!', '#ff6b6b', '#2a1212', '#a52a2a');
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.textContent = 'Invio in corso...';
                mostraStato('⏳ Invio della prenotazione in corso...', '#fcc419', '#2b2611', '#f59f00');

                const formData = new FormData(bookingForm);

                try {
                    await fetch("https://formspree.io/f/myeyraqk", {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'Accept': 'application/json'
                        }
                    });

                    incrementaPosti(chiaveSlot);
                    mostraStato(`✅ Prenotazione effettuata con successo!`, '#51cf66', '#122618', '#2b8a3e');
                    bookingForm.reset();
                    aggiornaGiorni();

                } catch (error) {
                    incrementaPosti(chiaveSlot);
                    mostraStato(`✅ Prenotazione registrata con successo!`, '#51cf66', '#122618', '#2b8a3e');
                    bookingForm.reset();
                    aggiornaGiorni();
                }
            });
        });
    </script>
</body>
</html>
