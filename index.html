<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Life - Prenotazione Corsi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ff0000;
        }
        .container {
            background: #050000;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            border: 2px solid #ff0000;
        }
        .brand-title {
            color: #ff0000;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0 0 5px 0;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            color: #ff0000;
            font-size: 20px;
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #cc0000;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }
        .dashboard-corsi {
            background: #100000;
            border: 1px solid #ff0000;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .dashboard-title {
            font-size: 13px;
            font-weight: bold;
            color: #ff3333;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 1px;
        }
        .slot-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 160px;
            overflow-y: auto;
        }
        .slot-item {
            display: flex;
            justify-content: space-between;
            background: #000000;
            padding: 7px 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #330000;
            color: #ff0000;
        }
        .slot-item.esaurito {
            border-color: #ff0000;
            background: #1a0000;
            color: #ff4d4d;
        }
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
            color: #ff0000;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ff0000;
            background-color: #000000;
            color: #ff0000;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #880000;
        }
        input:disabled, select:disabled {
            background-color: #1a0000;
            color: #550000;
            border-color: #550000;
            cursor: not-allowed;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        button {
            background-color: #ff0000;
            color: #000000;
            border: 2px solid #ff0000;
            padding: 12px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button.btn-disdici {
            background-color: #000000;
            color: #ff0000;
        }
        button:disabled {
            background-color: #330000;
            color: #550000;
            border-color: #330000;
            cursor: not-allowed;
        }
        .status-message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ff0000;
            background-color: #000000;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="brand-title">Steel Life</h2>
        <h1>🏋️ Prenota o Disdici Corso</h1>
        <p class="subtitle">Seleziona attività, giorno e orario (Max 6 persone per slot)</p>

        <div class="dashboard-corsi">
            <div class="dashboard-title">📊 Stato Corsi in Tempo Reale</div>
            <div id="listaStatoCorsi" class="slot-grid">Caricamento stato corsi...</div>
        </div>

        <form id="bookingForm" onsubmit="eseguiPrenotazione(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Inserisci il nome" required oninput="salvaMemoriaUtente()">
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome</label>
                    <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome" required oninput="salvaMemoriaUtente()">
                </div>

                <div class="form-group">
                    <label for="attivita">Attività</label>
                    <select id="attivita" name="attivita" required onchange="cambiaAttivita()">
                        <option value="">Seleziona attività</option>
                        <option value="MMA">MMA</option>
                        <option value="Boxe">Boxe</option>
                        <option value="Kickboxing">Kickboxing</option>
                        <option value="BJJ">BJJ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="giorno">Giorno</label>
                    <select id="giorno" name="giorno" required onchange="cambiaGiorno()">
                        <option value="">Seleziona prima un'attività</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="orario">Orario</label>
                    <select id="orario" name="orario" required onchange="controllaSlot()">
                        <option value="">Seleziona prima un giorno</option>
                    </select>
                </div>

                <div class="form-group btn-container">
                    <button type="submit" id="submitBtn">PRENOTA</button>
                    <button type="button" id="disdiciBtn" class="btn-disdici" onclick="eseguiDisdetta()">DISDICI</button>
                </div>
            </div>
        </form>

        <div id="formStatus" class="status-message">Pronto per la prenotazione.</div>
    </div>

    <script>
        const GITHUB_USER = 'gabrielderinaldis321-maker';
        const GITHUB_REPO = 'Prenotazioni-Palestra';
        const GITHUB_TOKEN = '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';

        let remoteData = { settimanaCorrente: "", prenotazioni: {} };
        let fileSha = '';

        const orariDisponibili = {
            "MMA": { giorni: ["Lunedì", "Mercoledì", "Venerdì"], orari: ["18:00 - 19:00", "19:00 - 20:00", "20:00 - 21:00"] },
            "Boxe": { giorni: ["Martedì", "Giovedì"], orari: ["18:00 - 19:00"] },
            "Kickboxing": { giorni: ["Martedì", "Giovedì"], orari: ["19:00 - 20:00"] },
            "BJJ": { giorni: ["Martedì", "Giovedì"], orari: ["20:00 - 21:00"] }
        };

        // Carica nome e cognome salvati in precedenza dal browser
        window.addEventListener('DOMContentLoaded', () => {
            const savedNome = localStorage.getItem('steel_life_nome');
            const savedCognome = localStorage.getItem('steel_life_cognome');
            if (savedNome) document.getElementById('nome').value = savedNome;
            if (savedCognome) document.getElementById('cognome').value = savedCognome;
            scaricaDatiDaGitHub();
        });

        function salvaMemoriaUtente() {
            localStorage.setItem('steel_life_nome', document.getElementById('nome').value);
            localStorage.setItem('steel_life_cognome', document.getElementById('cognome').value);
        }

        function getSettimana() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const inizio = new Date(d.getFullYear(), 0, 1);
            return `${d.getFullYear()}-W${Math.ceil((((d - inizio) / 86400000) + 1) / 7)}`;
        }

        function getChiave(a, g, o) {
            return `${a}_${g}_${o}`;
        }

        function mostraStato(testo, colore) {
            const st = document.getElementById('formStatus');
            if(st) {
                st.textContent = testo;
                st.style.color = colore;
            }
        }

        // 1. LETTURA DIRETTA DAL SITO (Senza API complesse, perfetta per smartphone e PC)
        async function scaricaDatiDaGitHub() {
            try {
                const url = `./prenotazioni.json?t=${Date.now()}`;
                const res = await fetch(url, {
                    cache: 'no-store'
                });
                
                if(res.ok) {
                    remoteData = await res.json();
                } else {
                    remoteData = { settimanaCorrente: getSettimana(), prenotazioni: {} };
                }
            } catch(e) {
                console.log("Errore lettura dati", e);
                remoteData = { settimanaCorrente: getSettimana(), prenotazioni: {} };
            }

            const settimanaAttuale = getSettimana();
            if(!remoteData.settimanaCorrente || remoteData.settimanaCorrente !== settimanaAttuale) {
                remoteData.settimanaCorrente = settimanaAttuale;
                remoteData.prenotazioni = {};
            }

            aggiornaDashboard();
            controllaSlot();
        }

        // 2. SCRITTURA USANDO LE API DI GITHUB (Solo quando si prenota o disdice)
        async function salvaDatiSuGitHub() {
            try {
                // Prende l'ultimo SHA aggiornato prima di scrivere per evitare conflitti
                const urlGet = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/prenotazioni.json?t=${Date.now()}`;
                const resGet = await fetch(urlGet, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' }
                });
                if(resGet.ok) {
                    const jsonGet = await resGet.json();
                    fileSha = jsonGet.sha;
                    const serverData = JSON.parse(atob(jsonGet.content));
                    
                    if(serverData.prenotazioni) {
                        for(let chiave in remoteData.prenotazioni) {
                            if(!serverData.prenotazioni[chiave] || serverData.prenotazioni[chiave] < remoteData.prenotazioni[chiave]) {
                                serverData.prenotazioni[chiave] = remoteData.prenotazioni[chiave];
                            }
                        }
                        remoteData.prenotazioni = serverData.prenotazioni;
                    }
                }

                const urlPut = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/prenotazioni.json`;
                const contentEncoded = btoa(JSON.stringify(remoteData, null, 2));
                
                const res = await fetch(urlPut, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Aggiornamento prenotazioni Steel Life",
                        content: contentEncoded,
                        sha: fileSha
                    })
                });

                if(res.ok) {
                    const json = await res.json();
                    fileSha = json.content.sha;
                }
            } catch(e) {
                console.log("Errore salvataggio su GitHub", e);
            }
        }

        function aggiornaDashboard() {
            const lista = document.getElementById('listaStatoCorsi');
            if(!lista) return;
            lista.innerHTML = '';
            
            for (const [att, dati] of Object.entries(orariDisponibili)) {
                dati.giorni.forEach(g => {
                    dati.orari.forEach(o => {
                        const chiave = getChiave(att, g, o);
                        const posti = remoteData.prenotazioni && remoteData.prenotazioni[chiave] ? remoteData.prenotazioni[chiave] : 0;
                        const div = document.createElement('div');
                        div.className = `slot-item ${posti >= 6 ? 'esaurito' : ''}`;
                        div.innerHTML = `<span><b>${att}</b> (${g} - ${o})</span> <span>${posti >= 6 ? 'ESAURITO (6/6)' : `${posti}/6 posti`}</span>`;
                        lista.appendChild(div);
                    });
                });
            }
        }

        function cambiaAttivita() {
            const att = document.getElementById('attivita').value;
            const gSelect = document.getElementById('giorno');
            const oSelect = document.getElementById('orario');
            gSelect.innerHTML = '<option value="">Seleziona giorno</option>';
            oSelect.innerHTML = '<option value="">Seleziona prima un giorno</option>';
            if(att && orariDisponibili[att]) {
                orariDisponibili[att].giorni.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g; opt.textContent = g;
                    gSelect.appendChild(opt);
                });
            }
            mostraStato("Seleziona giorno e orario.", "#ff0000");
        }

        function cambiaGiorno() {
            const att = document.getElementById('attivita').value;
            const g = document.getElementById('giorno').value;
            const oSelect = document.getElementById('orario');
            oSelect.innerHTML = '<option value="">Seleziona orario</option>';
            if(att && g && orariDisponibili[att]) {
                orariDisponibili[att].orari.forEach(o => {
                    const opt = document.createElement('option');
                    opt.value = o; opt.textContent = o;
                    oSelect.appendChild(opt);
                });
            }
            mostraStato("Seleziona l'orario.", "#ff0000");
        }

        function controllaSlot() {
            const att = document.getElementById('attivita').value;
            const g = document.getElementById('giorno').value;
            const o = document.getElementById('orario').value;
            const submitBtn = document.getElementById('submitBtn');

            if(att && g && o) {
                const chiave = getChiave(att, g, o);
                const posti = remoteData.prenotazioni && remoteData.prenotazioni[chiave] ? remoteData.prenotazioni[chiave] : 0;

                if(posti >= 6) {
                    mostraStato("⛔ CORSO AL COMPLETO (6/6 posti esauriti).", "#ff0000");
                    submitBtn.disabled = true;
                    submitBtn.textContent = "CORSO ESAURITO";
                } else {
                    mostraStato(`ℹ️ Posti occupati: ${posti}/6 (Disponibili: ${6 - posti})`, "#00ff00");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "PRENOTA";
                }
            }
        }

        async function eseguiPrenotazione(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "ATTENDI...";

            const att = document.getElementById('attivita').value;
            const g = document.getElementById('giorno').value;
            const o = document.getElementById('orario').value;
            const nome = document.getElementById('nome').value;
            const cognome = document.getElementById('cognome').value;
            const chiave = getChiave(att, g, o);
            
            mostraStato("⏳ Verifica disponibilità in corso...", "#ff0000");
            await scaricaDatiDaGitHub();

            const posti = remoteData.prenotazioni && remoteData.prenotazioni[chiave] ? remoteData.prenotazioni[chiave] : 0;
            if(posti >= 6) {
                mostraStato("❌ Spiacenti, il corso è appena esaurito!", "#ff0000");
                submitBtn.disabled = false;
                submitBtn.textContent = "CORSO ESAURITO";
                controllaSlot();
                return;
            }
            
            if(!remoteData.prenotazioni) remoteData.prenotazioni = {};
            remoteData.prenotazioni[chiave] = posti + 1;

            mostraStato("⏳ Registrazione prenotazione...", "#ff0000");
            await salvaDatiSuGitHub();
            aggiornaDashboard();

            const numeroCiro = "393281814024";
            const url = `https://wa.me/${numeroCiro}?text=${encodeURIComponent(`🏋️ *Nuova Prenotazione - Steel Life*\n👤 *Nome:* ${nome} ${cognome}\n🥊 *Attività:* ${att}\n📅 *Giorno:* ${g}\n⏰ *Orario:*${o}`)}`;
            
            mostraStato("✅ Prenotazione confermata! Apertura WhatsApp...", "#00ff00");
            setTimeout(() => { 
                window.location.href = url; 
                submitBtn.disabled = false;
                submitBtn.textContent = "PRENOTA";
            }, 800);
        }

        async function eseguiDisdetta() {
            const disdiciBtn = document.getElementById('disdiciBtn');
            disdiciBtn.disabled = true;
            disdiciBtn.textContent = "ATTENDI...";

            const att = document.getElementById('attivita').value;
            const g = document.getElementById('giorno').value;
            const o = document.getElementById('orario').value;
            const nome = document.getElementById('nome').value;
            const cognome = document.getElementById('cognome').value;

            if(!att || !g || !o || !nome || !cognome) {
                mostraStato("⚠️ Compila tutti i campi per disdire.", "#ff0000");
                disdiciBtn.disabled = false;
                disdiciBtn.textContent = "DISDICI";
                return;
            }

            const chiave = getChiave(att, g, o);
            mostraStato("⏳ Aggiornamento in corso...", "#ff0000");
            await scaricaDatiDaGitHub();

            const posti = remoteData.prenotazioni && remoteData.prenotazioni[chiave] ? remoteData.prenotazioni[chiave] : 0;
            if(posti > 0) {
                remoteData.prenotazioni[chiave] = posti - 1;
            }

            await salvaDatiSuGitHub();
            aggiornaDashboard();

            const numeroCiro = "393281814024";
            const url = `https://wa.me/${numeroCiro}?text=${encodeURIComponent(`Ciao Ciro, vorrei disdire la mia prenotazione per il corso di ${att} di ${g} alle${o}. Nome: ${nome}${cognome}`)}`;
            
            mostraStato("🗑️ Posto liberato! Apertura WhatsApp...", "#00ff00");
            setTimeout(() => { 
                window.location.href = url; 
                disdiciBtn.disabled = false;
                disdiciBtn.textContent = "DISDICI";
            }, 800);
        }
    </script>
</body>
</html>
