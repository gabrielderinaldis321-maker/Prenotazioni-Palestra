<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Life - Prenotazione e Disdetta Corsi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ff0000;
        }

        .container {
            background: #050000;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(255, 0, 0, 0.4);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            border: 2px solid #ff0000;
        }

        .brand-title {
            color: #ff0000;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0 0 5px 0;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #ff0000;
            font-size: 20px;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #cc0000;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }

        .dashboard-corsi {
            background: #100000;
            border: 1px solid #ff0000;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .dashboard-title {
            font-size: 13px;
            font-weight: bold;
            color: #ff3333;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 1px;
        }

        .slot-grid {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-height: 160px;
            overflow-y: auto;
        }

        .slot-item {
            display: flex;
            justify-content: space-between;
            background: #000000;
            padding: 7px 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid #330000;
            color: #ff0000;
        }

        .slot-item.esaurito {
            border-color: #ff0000;
            background: #1a0000;
            color: #ff4d4d;
        }

        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
            color: #ff0000;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ff0000;
            background-color: #000000;
            color: #ff0000;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }

        input::placeholder {
            color: #880000;
        }

        input:disabled, select:disabled {
            background-color: #1a0000;
            color: #550000;
            border-color: #550000;
            cursor: not-allowed;
        }

        input:focus, select:focus {
            border-color: #ff3333;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button {
            background-color: #ff0000;
            color: #000000;
            border: 2px solid #ff0000;
            padding: 12px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button.btn-disdici {
            background-color: #000000;
            color: #ff0000;
            border: 2px solid #ff0000;
        }

        button.btn-disdici:hover:not(:disabled) {
            background-color: #ff0000;
            color: #000000;
        }

        button:hover:not(:disabled) {
            background-color: #000000;
            color: #ff0000;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #330000;
            color: #550000;
            border-color: #330000;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ff0000;
            background-color: #000000;
            color: #ff0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="brand-title">Steel Life</h2>
        <h1>🏋️ Prenota o Disdici Corso</h1>
        <p class="subtitle">Seleziona attività, giorno e orario (Max 6 persone per slot)</p>

        <!-- Riepilogo in tempo reale dei corsi della settimana -->
        <div class="dashboard-corsi">
            <div class="dashboard-title">📊 Stato Corsi di questa Settimana</div>
            <div id="listaStatoCorsi" class="slot-grid"></div>
        </div>

        <form id="bookingForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Inserisci il nome" required>
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome</label>
                    <input type="text" id="cognome" name="cognome" placeholder="Inserisci il cognome" required>
                </div>

                <div class="form-group">
                    <label for="attivita">Attività</label>
                    <select id="attivita" name="attivita" required>
                        <option value="">Seleziona attività</option>
                        <option value="MMA">MMA</option>
                        <option value="Boxe">Boxe</option>
                        <option value="Kickboxing">Kickboxing</option>
                        <option value="BJJ">BJJ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="giorno">Giorno</label>
                    <select id="giorno" name="giorno" required>
                        <option value="">Seleziona prima un'attività</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="orario">Orario</label>
                    <select id="orario" name="orario" required>
                        <option value="">Seleziona prima un giorno</option>
                    </select>
                </div>

                <div class="form-group btn-container">
                    <button type="submit" id="submitBtn">PRENOTA</button>
                    <button type="button" id="disdiciBtn" class="btn-disdici">DISDICI</button>
                </div>
            </div>
        </form>

        <div id="formStatus" class="status-message">Benvenuto! Seleziona i campi per procedere.</div>
    </div>

    <script>
        // --- CONFIGURAZIONE JSONBIN.IO ---
        const BIN_ID = '6ab1a2cfffd51605320c12e';[cite: 2]
        const MASTER_KEY = '$2a$10$STsCYyAaMcKn0BiVzSxaM.ZhYtmH058eoAaQieLBr7y.oMeOSoq8C';
        // ---------------------------------

        let remoteData = { prenotazioni: {} };

        const orariDisponibili = {
            "MMA": {
                giorni: ["Lunedì", "Mercoledì", "Venerdì"],
                orari: ["18:00 - 19:00", "19:00 - 20:00", "20:00 - 21:00"]
            },
            "Boxe": {
                giorni: ["Martedì", "Giovedì"],
                orari: ["18:00 - 19:00"]
            },
            "Kickboxing": {
                giorni: ["Martedì", "Giovedì"],
                orari: ["19:00 - 20:00"]
            },
            "BJJ": {
                giorni: ["Martedì", "Giovedì"],
                orari: ["20:00 - 21:00"]
            }
        };

        function getNumeroSettimanaCorrente() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 4 - (d.getDay() || 7));
            const annoInizio = new Date(d.getFullYear(), 0, 1);
            return `${d.getFullYear()}-W${Math.ceil((((d - annoInizio) / 86400000) + 1) / 7)}`;
        }

        function getChiaveSlot(attivita, giorno, orario) {
            return `${getNumeroSettimanaCorrente()}_${attivita}_${giorno}_${orario}`;
        }

        function mostraStato(messaggio, coloreTesto, coloreSfondo, coloreBordo) {
            const formStatus = document.getElementById('formStatus');
            if (!formStatus) return;
            formStatus.textContent = messaggio;
            formStatus.style.color = coloreTesto;
            formStatus.style.backgroundColor = coloreSfondo;
            formStatus.style.borderColor = coloreBordo;
        }

        function getPostiOccupati(chiaveSlot) {
            return remoteData.prenotazioni && remoteData.prenotazioni[chiaveSlot] ? remoteData.prenotazioni[chiaveSlot] : 0;
        }

        function aggiornaDashboardCorsi() {
            const listaStatoCorsi = document.getElementById('listaStatoCorsi');
            if (!listaStatoCorsi) return;
            listaStatoCorsi.innerHTML = '';
            
            for (const [nomeAttivita, dati] of Object.entries(orariDisponibili)) {
                dati.giorni.forEach(giorno => {
                    dati.orari.forEach(orario => {
                        const chiave = getChiaveSlot(nomeAttivita, giorno, orario);
                        const posti = getPostiOccupati(chiave);
                        
                        const div = document.createElement('div');
                        div.className = `slot-item ${posti >= 6 ? 'esaurito' : ''}`;
                        div.innerHTML = `<span><b>${nomeAttivita}</b> (${giorno} - ${orario})</span> <span>${posti >= 6 ? 'ESAURITO (6/6)' : `${posti}/6 posti`}</span>`;
                        listaStatoCorsi.appendChild(div);
                    });
                });
            }
        }

        async function fetchBookings() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/` + BIN_ID + `/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const result = await response.json();
                remoteData = result.record || { prenotazioni: {} };
            } catch (error) {
                console.error("Errore cloud:", error);
            }
            aggiornaDashboardCorsi();
        }

        async function saveBookings() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/` + BIN_ID, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(remoteData)
                });
            } catch (error) {
                console.error("Errore salvataggio:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const attivitaSelect = document.getElementById('attivita');
            const giornoSelect = document.getElementById('giorno');
            const orarioSelect = document.getElementById('orario');
            const nomeInput = document.getElementById('nome');
            const cognomeInput = document.getElementById('cognome');
            const submitBtn = document.getElementById('submitBtn');
            const disdiciBtn = document.getElementById('disdiciBtn');
            const bookingForm = document.getElementById('bookingForm');

            function ripristinaCampi() {
                nomeInput.disabled = false;
                cognomeInput.disabled = false;
                submitBtn.disabled = false;
                submitBtn.textContent = 'PRENOTA';
            }

            function controllaSlot() {
                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                const orario = orarioSelect.value;

                if (attivita && giorno && orario) {
                    const chiaveSlot = getChiaveSlot(attivita, giorno, orario);
                    const postiOccupati = getPostiOccupati(chiaveSlot);

                    if (postiOccupati >= 6) {
                        mostraStato('⛔ CORSO AL COMPLETO (6/6 posti esauriti).', '#ff0000', '#220000', '#ff0000');
                        nomeInput.disabled = true;
                        cognomeInput.disabled = true;
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'CORSO ESAURITO';
                    } else {
                        mostraStato(`ℹ️ Posti occupati: ${postiOccupati}/6 (Disponibili: ${6 - postiOccupati})`, '#00ff00', '#002200', '#00ff00');
                        ripristinaCampi();
                    }
                }
            }

            attivitaSelect.addEventListener('change', () => {
                const attivita = attivitaSelect.value;
                giornoSelect.innerHTML = '<option value="">Seleziona giorno</option>';
                orarioSelect.innerHTML = '<option value="">Seleziona orario</option>';
                ripristinaCampi();
                mostraStato("Seleziona giorno e orario.", "#ff0000", "#000000", "#ff0000");

                if (attivita && orariDisponibili[attivita]) {
                    orariDisponibili[attivita].giorni.forEach(giorno => {
                        const opt = document.createElement('option');
                        opt.value = giorno;
                        opt.textContent = giorno;
                        giornoSelect.appendChild(opt);
                    });
                }
            });

            giornoSelect.addEventListener('change', () => {
                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                orarioSelect.innerHTML = '<option value="">Seleziona orario</option>';
                ripristinaCampi();
                mostraStato("Seleziona l'orario.", "#ff0000", "#000000", "#ff0000");

                if (attivita && giorno && orariDisponibili[attivita]) {
                    orariDisponibili[attivita].orari.forEach(orario => {
                        const opt = document.createElement('option');
                        opt.value = orario;
                        opt.textContent = orario;
                        orarioSelect.appendChild(opt);
                    });
                }
            });

            orarioSelect.addEventListener('change', controllaSlot);

            bookingForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                const orario = orarioSelect.value;
                const nome = nomeInput.value;
                const cognome = cognomeInput.value;
                
                const chiaveSlot = getChiaveSlot(attivita, giorno, orario);
                if (getPostiOccupati(chiaveSlot) >= 6) {
                    mostraStato('❌ Posti esauriti!', '#ff0000', '#220000', '#ff0000');
                    return;
                }
                
                if (!remoteData.prenotazioni) remoteData.prenotazioni = {};
                remoteData.prenotazioni[chiaveSlot] = getPostiOccupati(chiaveSlot) + 1;

                mostraStato('⏳ Salvataggio in corso...', '#ff0000', '#000000', '#ff0000');
                await saveBookings();
                aggiornaDashboardCorsi();

                const urlWhatsApp = `https://wa.me/393281814024?text=${encodeURIComponent(`🏋️ *Nuova Prenotazione - Steel Life*\n👤 *Nome:* ${nome} ${cognome}\n🥊 *Attività:* ${attivita}\n📅 *Giorno:* ${giorno}\n⏰ *Orario:*${orario}`)}`;
                
                mostraStato('✅ Registrato! Apertura WhatsApp...', '#00ff00', '#002200', '#00ff00');
                setTimeout(() => { window.location.href = urlWhatsApp; }, 800);
            });

            disdiciBtn.addEventListener('click', async () => {
                const attivita = attivitaSelect.value;
                const giorno = giornoSelect.value;
                const orario = orarioSelect.value;
                const nome = nomeInput.value;
                const cognome = cognomeInput.value;

                if (!attivita || !giorno || !orario || !nome || !cognome) {
                    mostraStato('⚠️ Compila tutti i campi per disdire.', '#ff0000', '#220000', '#ff0000');
                    return;
                }

                const chiaveSlot = getChiaveSlot(attivita, giorno, orario);
                if (getPostiOccupati(chiaveSlot) > 0) {
                    remoteData.prenotazioni[chiaveSlot] = getPostiOccupati(chiaveSlot) - 1;
                }

                mostraStato('⏳ Disdetta in corso...', '#ff0000', '#000000', '#ff0000');
                await saveBookings();
                aggiornaDashboardCorsi();

                const urlWhatsApp = `https://wa.me/393281814024?text=${encodeURIComponent(`Ciao Ciro, vorrei disdire la mia prenotazione per il corso di ${attivita} di ${giorno} alle${orario}. Nome: ${nome}${cognome}`)}`;
                
                mostraStato('🗑️ Liberato! Apertura WhatsApp...', '#00ff00', '#002200', '#00ff00');
                setTimeout(() => { window.location.href = urlWhatsApp; }, 800);
            });

            fetchBookings();
        });
    </script>
</body>
</html>
