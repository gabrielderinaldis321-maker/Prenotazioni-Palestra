<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione Corsi MMA & BJJ - Ciro Morra</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--accent-orange); margin-bottom: 5px; font-size: 1.8rem; text-transform: uppercase; }
        header p { color: var(--text-muted); font-size: 0.95rem; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; color: var(--text-muted); }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background-color: #0f172a; color: #fff; font-size: 1rem; box-sizing: border-box; }
        .slots-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 15px; }
        .slot-card { background-color: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; text-align: center; }
        .slot-card.selected { border-color: var(--accent-orange); background-color: rgba(249, 115, 22, 0.1); }
        .slot-time { font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; color: #fff; }
        .slot-availability { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
        .btn-select { background-color: var(--border-color); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .slot-card.selected .btn-select { background-color: var(--accent-orange); color: #000; }
        .actions-container { display: flex; gap: 10px; margin-top: 25px; }
        .btn-book { flex: 1; background: linear-gradient(135deg, #25D366, #128C7E); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .btn-cancel { flex: 1; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .day-selector { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 20px; }
        .day-btn { background-color: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .day-btn.active { background-color: var(--accent-orange); color: #000; border-color: var(--accent-orange); }
        .loading { text-align: center; color: var(--accent-orange); font-style: italic; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🥋 Prenotazione Corsi MMA & BJJ</h1>
            <p>Seleziona il giorno, il turno del corso di Ciro Morra e prenota su WhatsApp</p>
        </header>

        <div class="day-selector" id="daySelector">
            <button class="day-btn active" onclick="setDay('Lunedì')">Lunedì</button>
            <button class="day-btn" onclick="setDay('Martedì')">Martedì</button>
            <button class="day-btn" onclick="setDay('Mercoledì')">Mercoledì</button>
            <button class="day-btn" onclick="setDay('Giovedì')">Giovedì</button>
            <button class="day-btn" onclick="setDay('Venerdì')">Venerdì</button>
            <button class="day-btn" onclick="setDay('Sabato')">Sabato</button>
        </div>

        <div class="card">
            <div class="form-group">
                <label for="userName">Il tuo Nome e Cognome</label>
                <input type="text" id="userName" placeholder="Es. Mario Rossi" required>
            </div>

            <input type="hidden" id="trainerPhone" value="393281814024">

            <div id="loadingStatus" class="loading" style="display:none;">Sincronizzazione in corso...</div>
            <label>Turni e Corsi Disponibili (Max 6 partecipanti)</label>
            <div class="slots-container" id="slotsContainer"></div>

            <div class="actions-container">
                <button class="btn-book" onclick="sendBooking()">Prenota Corso</button>
                <button class="btn-cancel" onclick="sendCancellation()">Disdici Corso</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURAZIONE JSONBIN.IO ---
        const BIN_ID = '6ab1a2cfffd51605320c12e';[cite: 2]
        const MASTER_KEY = '$2a$10$STsCYyAaMcKn0BiVzSxaM.ZhYtmH058eoAaQieLBr7y.oMeOSoq8C';
        // ---------------------------------

        let currentDay = 'Lunedì';
        let selectedSlot = null;
        let remoteData = { prenotazioni: {} };

        // Orari specifici dei corsi di arti marziali gestiti da Ciro
        const weekdaysSlots = ["17:00 - 18:30 (BJJ)", "18:30 - 20:00 (MMA)", "20:00 - 21:30 (Grappling)"];
        const saturdaySlots = ["10:00 - 11:30 (BJJ Open Mat)", "11:30 - 13:00 (MMA Sparring)"];
        const MAX_CAPACITY = 6;

        async function fetchBookings() {
            document.getElementById('loadingStatus').style.display = 'block';
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/` + BIN_ID + `/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const result = await response.json();
                remoteData = result.record || { prenotazioni: {} };
            } catch (error) {
                console.error("Errore di caricamento dati:", error);
            }
            document.getElementById('loadingStatus').style.display = 'none';
            renderSlots();
        }

        async function saveBookings() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/` + BIN_ID, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(remoteData)
                });
            } catch (error) {
                console.error("Errore di salvataggio dati:", error);
            }
        }

        function setDay(day) {
            currentDay = day;
            selectedSlot = null;
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.toggle('active', btn.textContent === day));
            renderSlots();
        }

        function getStorageKey(slot) { return `${currentDay}_${slot}`; }

        function getBookedCount(slot) {
            const key = getStorageKey(slot);
            return remoteData.prenotazioni && remoteData.prenotazioni[key] ? remoteData.prenotazioni[key] : 0;
        }

        function renderSlots() {
            const container = document.getElementById('slotsContainer');
            container.innerHTML = '';
            const activeSlots = (currentDay === 'Sabato') ? saturdaySlots : weekdaysSlots;

            activeSlots.forEach(slot => {
                const booked = getBookedCount(slot);
                const available = MAX_CAPACITY - booked;
                const isSelected = selectedSlot === slot;
                const card = document.createElement('div');
                card.className = `slot-card ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div class="slot-time">🥋 ${slot}</div>
                    <div class="slot-availability">Disponibili: <strong>${available > 0 ? available : 0}</strong> / ${MAX_CAPACITY}</div>
                    <button class="btn-select" onclick="selectSlot('${slot}')">${isSelected ? 'Selezionato' : 'Seleziona'}</button>
                `;
                container.appendChild(card);
            });
        }

        function selectSlot(slot) { selectedSlot = slot; renderSlots(); }

        async function sendBooking() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('trainerPhone').value;
            if (!name) { alert('Inserisci il tuo nome e cognome.'); return; }
            if (!selectedSlot) { alert('Seleziona un turno.'); return; }

            await fetchBookings();

            const currentBooked = getBookedCount(selectedSlot);
            if (currentBooked >= MAX_CAPACITY) {
                alert('Spiacenti, questo turno ha raggiunto il limite massimo di 6 partecipanti.');
                renderSlots();
                return;
            }

            const key = getStorageKey(selectedSlot);
            if (!remoteData.prenotazioni) remoteData.prenotazioni = {};
            remoteData.prenotazioni[key] = currentBooked + 1;

            document.getElementById('loadingStatus').style.display = 'block';
            await saveBookings();
            document.getElementById('loadingStatus').style.display = 'none';

            window.open(`https://wa.me/${phone}?text=🥋 *PRENOTAZIONE CORSO MMA/BJJ*%0A👤 *${encodeURIComponent(name)}*%0A📅 *${currentDay}* - *${selectedSlot}*`, '_blank');

            selectedSlot = null;
            fetchBookings();
        }

        async function sendCancellation() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('trainerPhone').value;
            if (!name) { alert('Inserisci il tuo nome e cognome.'); return; }
            if (!selectedSlot) { alert('Seleziona il turno da disdire.'); return; }

            await fetchBookings();

            const currentBooked = getBookedCount(selectedSlot);
            if (currentBooked > 0) {
                const key = getStorageKey(selectedSlot);
                remoteData.prenotazioni[key] = currentBooked - 1;
            }

            document.getElementById('loadingStatus').style.display = 'block';
            await saveBookings();
            document.getElementById('loadingStatus').style.display = 'none';

            window.open(`https://wa.me/${phone}?text=❌ *DISDETTA CORSO MMA/BJJ*%0A👤 *${encodeURIComponent(name)}*%0A📅 *${currentDay}* - *${selectedSlot}*`, '_blank');

            selectedSlot = null;
            fetchBookings();
        }

        fetchBookings();
    </script>
</body>
</html>
